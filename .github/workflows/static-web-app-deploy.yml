# Workflow name shown in the GitHub Actions UI
name: 'Deploy Chore Wars App'

# Trigger: deploy the app (static content + API) whenever its files change on
# main, and allow manual runs from the Actions UI.
on:
  push:
    branches:
      - main
    paths:
      - 'apps/chores/**'
      - '.github/workflows/static-web-app-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: 'Build and Deploy'
    runs-on: ubuntu-latest
    # Targets the same GitHub environment the SWA was provisioned into, so
    # this job can see the environment-scoped AZURE_STATIC_WEB_APPS_API_TOKEN
    # secret set after running static-web-app.yml.
    environment: main
    permissions:
      contents: read

    steps:
      # Pulls the repo so the app content is available to the deploy action
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false
          lfs: false

      # Deploys the static content and Managed Functions API to the existing
      # Azure Static Web App. The API token is generated when the SWA is
      # provisioned (Terraform output api_key) and stored as the
      # AZURE_STATIC_WEB_APPS_API_TOKEN secret.
      # NOTE: Pin this to a specific commit SHA before use, matching your
      # convention. Look up the latest release commit at:
      # https://github.com/Azure/static-web-apps-deploy/releases
      # then replace the tag below with @<full-40-char-sha>.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9  # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'upload'
          # Folder containing the app content (single index.html, no build step)
          app_location: 'apps/chores'
          # Managed Functions API (Node.js) — deployed alongside the app, still
          # within the Static Web Apps Free tier. Oryx builds it (npm install)
          # since only skip_app_build (not skip_api_build) is set below.
          api_location: 'apps/chores/api'
          # Content is served straight from app_location (no build output folder)
          output_location: ''
          skip_app_build: true
